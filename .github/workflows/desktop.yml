name: Desktop bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Apple Silicon App and DMG
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --frozen --extra desktop --group bundle --python 3.12
      - run: uv run --frozen --extra desktop --group bundle python scripts/build_desktop.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TingSub-macos-arm64-unsigned
          path: |
            .local/bundle/*.dmg
            .local/bundle/*.sha256
          retention-days: 14
