name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks and package
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen ruff check src tests scripts
      - run: uv run --frozen pytest -v
      - run: uv build
  extension:
    name: Extension, browser and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python3 scripts/check_docs.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:desktop
      - run: npm run test:overlay
      - name: Package unpacked extension
        run: python3 scripts/package_extension.py
      - name: Verify packaged extension in Chromium
        run: node tests-js/extension-package.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tingsub-extension
          path: |
            dist/extension/*.zip
            dist/extension/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Describe extension artifact
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Browser extension

          Download `tingsub-extension` from this run's Artifacts, then extract the inner versioned ZIP.
          In Chrome 116+, enable Developer mode in `chrome://extensions`, choose Load unpacked,
          and select the extracted folder containing `manifest.json`. Pair it with the TingSub app.
          SHA-256 and a real Chromium load check are included. This is not a Chrome Web Store release.
          EOF
  desktop:
    name: macOS distribution
    needs: [python, extension]
    uses: ./.github/workflows/desktop.yml
